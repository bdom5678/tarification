<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Cotation en ligne — RAWSUR Life</title>
<style>
:root{--navy:#05356B;--navyD:#032A55;--or:#F2A900;--orT:#9A6400;--bg:#F4F7FB;--card:#fff;--ink:#0E1E36;--soft:#46566E;--muted:#6B7A90;--line:#D5DEEA;--band:#E8EEF6;--ok:#1E7B4F;--err:#B42318;--warn:#8A5A00}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
h1{font-size:24px;margin:.2em 0;color:var(--navy)}
h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
.mt{margin-top:22px}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--navy) 0 8%,var(--or) 8% 22%,var(--navy) 22%)}
.top-in{display:flex;align-items:center;gap:12px;padding:8px 16px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.top .logo{height:34px;width:auto}
.ttl{display:flex;flex-direction:column;line-height:1.15}.ttl b{font-size:16px}.ttl span{font-size:12px;color:#D6E4F5}
.who{margin-left:auto;display:flex;flex-direction:column;text-align:right;line-height:1.2;min-width:0}.who b{font-size:13px}.who span{font-size:11px;color:#D6E4F5}
.tabs{display:flex;max-width:1200px;margin:0 auto;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;color:#D6E4F5;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:14px}
.tabs button.on{color:#fff;border-bottom-color:var(--or);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#resCol{position:sticky;top:110px}}
.col{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.fields{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.fields{grid-template-columns:1fr 1fr}.fields .wide{grid-column:1/-1}}
label{display:flex;flex-direction:column;font-size:13px;font-weight:600;color:var(--soft);gap:4px;min-width:0}
label i{color:var(--err);font-style:normal}
label small{font-weight:400;color:var(--muted);font-size:12px;min-height:1.2em}
label.off{opacity:.55}
input,select{width:100%;min-width:0;padding:10px 11px;border:1px solid #B9C6D8;border-radius:8px;background:#fff;font-size:16px;font-weight:400;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--or);outline-offset:1px;border-color:var(--navy)}
input:disabled,select:disabled{background:#EEF2F7;color:var(--soft)}
.locked{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--band);border-left:4px solid var(--navy);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.locked b{color:var(--navy)}.locked em{flex-basis:100%;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;min-height:44px}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navyD)}
.btn.ghost{border-color:transparent;background:transparent}
.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.btn.danger{color:var(--err);border-color:#E5B4AF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 8px}
.actions .btn{flex:1 1 180px}
.res .hero{background:var(--navy);color:#fff;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.hero span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--or);font-weight:600}
.hero b{font-size:clamp(26px,7vw,36px);line-height:1.2;color:var(--or)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpis div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.kpis span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}.kpis b{font-size:15px;color:var(--navy);overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block;margin:4px 0}
.chart .ax{stroke:#9FB3CC}.chart .bv{fill:#C3D0E0}.chart .bc{fill:#0A5AA3}.chart .bl{fill:var(--or)}.chart .lb{font-size:11px;fill:var(--muted);text-anchor:middle}.chart .lv{font-size:13px;font-weight:700;fill:var(--orT)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:10px}.legend i{display:inline-block;width:12px;height:12px;border-radius:2px}.legend .c1{background:#0A5AA3}.legend .c2{background:#C3D0E0;margin-left:10px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:360px;border:1px solid var(--line);border-radius:8px}
.tab{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.tab th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:600;padding:6px 8px;text-align:right;white-space:nowrap}
.tab td{padding:5px 8px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab tr:nth-child(even) td{background:#F7F9FC}
.tab .opt{display:none}@media(min-width:520px){.tab .opt{display:table-cell}}
.fine{font-size:12px;color:var(--muted);margin:8px 0}
.errs,.info{border-radius:8px;padding:10px 12px;font-size:13.5px}
.errs{background:#FDECEA;color:var(--err);border:1px solid #F5C2BC}.info{background:#FFF6DD;color:var(--warn);border:1px solid #F2D58C;margin-bottom:12px}
.errs ul,.info ul{margin:4px 0 0;padding-left:18px}
.msg{font-size:13.5px;min-height:1.4em;margin:6px 0}.msg.err{color:var(--err)}
.banner{background:#E7F4EC;border:1px solid #B7DEC6;color:#14532D;border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:14px;overflow-wrap:anywhere}
.warnbar{background:#FFF6DD;color:var(--warn);padding:8px 16px;font-size:13px;text-align:center}
.okbox{background:#E7F4EC;border:1px solid #B7DEC6;color:#14532D;border-radius:8px;padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere}.okbox .btn{margin-top:8px}
.hbar{display:flex;flex-wrap:wrap;gap:10px}.hbar input{flex:1 1 220px}.hbar .btn{flex:1 1 220px}
.list{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:960px){.list{grid-template-columns:1fr 1fr}}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.ih{display:flex;gap:10px;align-items:flex-start}.it{flex:1;min-width:0;display:flex;flex-direction:column}.it b{color:var(--navy);overflow-wrap:anywhere}.it span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ck input{width:20px;height:20px;margin-top:2px}
.badge{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--band);color:var(--soft);white-space:nowrap}.badge.ok{background:#E7F4EC;color:var(--ok)}
.im{display:flex;flex-direction:column;font-size:13px;color:var(--soft);margin:8px 0}.im b{color:var(--ink)}
.ia{display:flex;flex-wrap:wrap;gap:6px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.bar{display:grid;grid-template-columns:1fr;gap:2px 16px;margin:0;font-size:14px}
@media(min-width:560px){.bar{grid-template-columns:auto 1fr}}
.bar dt{font-weight:600;color:var(--soft)}.bar dd{margin:0 0 8px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy),var(--navyD))}
.login .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;padding:22px}
.lhead{background:var(--navy);margin:-22px -22px 4px;padding:16px;border-radius:10px 10px 0 0;border-bottom:4px solid var(--or)}.lhead .logo{height:56px;width:auto;display:block}
.sub{margin:0;color:var(--soft);font-size:14px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:8px 16px 24px}
.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100vw - 32px);transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--err)}.toast.warn{background:var(--warn)}
.errbar{position:sticky;top:0;z-index:30;background:#FDECEA;color:var(--err);border-bottom:2px solid var(--err);padding:10px 16px;font-size:14px;overflow-wrap:anywhere}.errbar .btn{margin-left:8px;min-height:32px;padding:4px 10px}
.prodsel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.prodsel button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;min-width:0}
.prodsel button b{color:var(--navy);font-size:16px}.prodsel button small{color:var(--muted);font-size:12px}
.prodsel button.on{border-color:var(--navy);background:var(--navy)}.prodsel button.on b{color:#fff}.prodsel button.on small{color:var(--or)}
.pbadge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:#E3EDF9;color:var(--navy);margin-right:4px}.pbadge.sec{background:#FFF1CC;color:var(--orT)}
.confirm{background:#FDECEA;border:1px solid #F5C2BC;color:var(--err);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}.confirm .ia{margin-top:6px}
.errtxt{color:var(--err);margin:4px 0}.warntxt{color:var(--warn)}.okbox p{margin:4px 0}.okbox .ia{margin-top:6px}.mt8{margin-top:8px}
@media(max-width:420px){.who{display:none}.top-in{padding:8px 12px}}
</style>
</head>

  function svgTrajectoire(tab) {
    const W = 600, H = 200, pl = 8, pr = 8, pt = 22, pb = 22, n = tab.length;
    const vmax = Math.max(...tab.map((l) => Math.max(l.capital, l.cumulVerse))) || 1;
    const bw = (W - pl - pr) / n, y = (v) => pt + (H - pt - pb) * (1 - v / vmax);
    let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Trajectoire du capital">`;
    s += `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" class="ax"/>`;
    tab.forEach((l, k) => {
      const x = pl + k * bw, w = Math.max(2, bw * 0.7), last = k === n - 1;
      s += `<rect x="${(x + (bw - w) / 2).toFixed(1)}" y="${y(l.cumulVerse).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - pb - y(l.cumulVerse)).toFixed(1)}" class="bv"/>`;
      s += `<rect x="${(x + (bw - w * 0.6) / 2).toFixed(1)}" y="${y(l.capital).toFixed(1)}" width="${(w * 0.6).toFixed(1)}" height="${(H - pb - y(l.capital)).toFixed(1)}" class="${last ? 'bl' : 'bc'}"><title>An ${l.annee} : ${fmt(l.capital, 2)} USD</title></rect>`;
      if (n <= 12 || l.annee % 5 === 0 || k === 0) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" class="lb">${l.annee}</text>`;
    });
    const L = tab[n - 1]; s += `<text x="${W - pr}" y="14" class="lv" text-anchor="end">${fmt(L.capital)} USD</text></svg>`;
    return s;
  }

  function livrer(blob, nom, quoi) {

    if (url) {

    if (!res.ok) throw new Error(res.erreurs.join(' '));

  function enveloppe(r, res) {
    const p = profil();
    const commercial = { nom: pdfSur(S.user.nom), code: S.user.code, bureau: pdfSur(S.user.bureau), telephone: pdfSur(p.telephone), email: pdfSur(p.email) };
    const client = { civilite: r.client.civilite, nom: pdfSur(r.client.nom), prenom: pdfSur(r.client.prenom), dateNaissance: r.client.dateNaissance, telephone: pdfSur(r.client.telephone), email: pdfSur(r.client.email), adresse: pdfSur(r.client.adresse), profession: pdfSur(r.client.profession) };
    if (produitDe(r) === 'sec') {
      return {
        format: 'sec-cotation-1', produit: 'SECURIS', ref: refNouvelle('SEC', S.user.code), creeLe: new Date().toISOString(), versionMoteur: SM.VERSION, versionBareme: PSEC.versionBareme,
        commercial, client, beneficiaire: pdfSur(r.beneficiaire),
        entree: { dateEffet: r.entree.dateEffet, duree: r.entree.duree, capital: r.entree.capital, fractionnement: r.entree.fractionnement },
        resultat: JSON.parse(JSON.stringify(res)),
        param: JSON.parse(JSON.stringify(PSEC)), empreinteBareme: SECC.empreinteBareme, statut: 'offre émise',
      };
    }
    return {
      format: 'lr-cotation-1', ref: refNouvelle('LR', S.user.code), creeLe: new Date().toISOString(), versionMoteur: M.VERSION, versionBareme: PARAM.versionBareme,
      commercial, client,
      entree: { dateEffet: r.entree.dateEffet, duree: r.entree.duree, versementInitial: r.entree.versementInitial, primePeriodique: r.entree.primePeriodique, fractionnement: r.entree.fractionnement },
      resultat: { capitalTerme: res.capitalTerme, totalVerse: res.totalVerse, totalFrais: res.totalFrais, totalInterets: res.totalInterets, gainNet: res.gainNet, rendementNetAnnualise: res.rendementNetAnnualise, primes1reAnnee: res.primes1reAnnee },
      param: Object.assign({}, PARAM, { fractionnements: PARAM.fractionnements.slice() }), statut: 'offre émise',
    };
  }
  async function emettre(r) {
    const msg = $('#pdfMsg'), b = $('#bPdf');
    const res = calculer(r), ec = erreursClient(r, true);
    if (!res.ok || ec.length) { msg.className = 'msg err'; msg.textContent = (res.ok ? ec : res.erreurs).join(' '); return; }
    b.disabled = true; msg.className = 'msg'; msg.textContent = 'Préparation de l’offre…';
    let etape = 'préparation';
    try {
      etape = 'bibliothèque PDF'; const J = jsPdf();
      etape = 'construction de la cotation'; const cot = enveloppe(r, res);
      etape = 'calcul de l’empreinte'; cot.empreinte = await empreinte(cot);
      etape = 'mise en page du PDF'; const R = construirePdf(J, cot);
      window.__lrDernierControle = R.controle;
      if (!R.controle.ok) { msg.className = 'msg err'; msg.textContent = 'Offre non générée : ' + R.controle.texte; b.disabled = false; return; }
      etape = 'création du fichier'; const blob = R.doc.output('blob');
      r.statut = 'offre émise'; r.cot = cot; r.client = cot.client; if (produitDe(r) === 'sec') r.beneficiaire = cot.beneficiaire;
      etape = 'enregistrement'; sauver(r); if (S.brouillons[produitDe(r)] === r) delete S.brouillons[produitDe(r)];
      etape = 'téléchargement'; const f = livrer(blob, nomPdf(cot), 'pdf');
      f.id = r.id; f.titre = `Offre ${cot.ref} générée (${R.pages} pages, mise en page contrôlée).`; S.livre = f;
      S.cur = r; render();
      if (f.err || ENV.dlBloque) toast('Offre générée, mais le téléchargement est bloqué : voir le message à l’écran.', 'err'); else toast(`Offre ${cot.ref} générée. ${R.controle.texte}`);
    } catch (err) {
      msg.className = 'msg err'; msg.textContent = `Génération impossible (étape : ${etape}) : ${err && err.message ? err.message : err}.`; b.disabled = false;
    }
  }
  function telechargerPdf(r, zoneId) {
    try { const J = jsPdf(); const R = construirePdf(J, r.cot); if (!R.controle.ok) throw new Error(R.controle.texte); const f = livrer(R.doc.output('blob'), nomPdf(r.cot), 'pdf'); f.id = r.id; annoncer(f, `Offre ${r.cot.ref} régénérée à l’identique.`, zoneId); }
    catch (err) { const z = zoneId && document.getElementById(zoneId); const t = 'PDF impossible : ' + (err && err.message ? err.message : err); if (z) { z.className = 'msg err'; z.textContent = t; } toast(t, 'err'); }
  }
  function exporterUn(r, zoneId) { const f = livrer(new Blob([JSON.stringify(r.cot, null, 2)], { type: 'application/json' }), nomJson(r.cot), 'json'); f.id = r.id; annoncer(f, `Cotation ${r.cot.ref} exportée (JSON).`, zoneId); }

  /* ---------- Mes cotations (Libre Retraite et SECURIS) ---------- */
  function resume(r) {
    const e = r.entree;
    if (produitDe(r) === 'sec') {
      const res = r.cot ? r.cot.resultat : (calculer(r).ok ? calculer(r) : null);
      return [`Capital ${usd(e.capital)} · ${e.duree} an${e.duree > 1 ? 's' : ''} · ${(SEC_FRAC[e.fractionnement] || '').toLowerCase()}`, `Prime TTC : <b>${res ? usd(res.primeTTC, 2) : '—'}</b>${res && e.fractionnement === 'annuel' ? ' par an' : ''}`];
    }
    const res = r.cot ? r.cot.resultat : (calculer(r).ok ? calculer(r) : null);
    const vers = [e.versementInitial > 0 ? `${usd(e.versementInitial)} initial` : '', e.primePeriodique > 0 && e.fractionnement !== 'unique' ? `${usd(e.primePeriodique)} ${FRAC_PAR[e.fractionnement]}` : ''].filter(Boolean).join(' + ') || '—';
    return [`${vers} · ${e.duree} an${e.duree > 1 ? 's' : ''}`, `Capital au terme : <b>${res ? usd(res.capitalTerme) : '—'}</b>`];
  }
  function renderHist() {
    const L = liste(), q = S.filtre.trim().toLowerCase();
    const vis = L.filter((r) => !q || [r.client.nom, r.client.prenom, r.client.telephone, r.client.email, r.cot && r.cot.ref, PROD[produitDe(r)]].join(' ').toLowerCase().includes(q));
    const em = L.filter((r) => r.statut === 'offre émise');
    if (!Object.keys(S.sel).length) em.forEach((r) => { if (!r.envoyeLe) S.sel[r.id] = true; });
    const nSel = em.filter((r) => S.sel[r.id]).length;
    const dt = CFG.contactDT || {};
    $('#main').innerHTML = `
      <section class="card"><div class="hbar"><input id="q" type="search" placeholder="Rechercher : nom, référence, produit…" value="${esc(S.filtre)}" aria-label="Rechercher">
        <button class="btn primary" id="bEnv" type="button" ${nSel ? '' : 'disabled'}>Envoyer à la Direction technique (${nSel})</button></div>
        <p class="fine">Les offres émises cochées (Libre Retraite et SECURIS) sont regroupées dans un fichier à transmettre${dt.email ? ` à ${esc(dt.email)}` : ' à la Direction technique'}. Par défaut, les offres non encore transmises sont cochées.</p>
        <div id="envMsg"></div></section>
      <div class="list">${vis.length ? vis.map((r) => {
        const emise = r.statut === 'offre émise', [l1, l2] = resume(r), pr = produitDe(r);
        const qui = `${r.client.civilite || ''} ${r.client.prenom || ''} ${String(r.client.nom || '').toUpperCase()}`.trim() || 'Client non renseigné';
        const conf = S.confirmDel === r.id;
        return `<article class="item" data-id="${esc(r.id)}">
          <div class="ih">${emise ? `<label class="ck"><input type="checkbox" data-sel="${esc(r.id)}" ${S.sel[r.id] ? 'checked' : ''} aria-label="Sélectionner"></label>` : ''}
            <div class="it"><b>${esc(qui)}</b><span><span class="pbadge ${pr}">${esc(PROD[pr])}</span> ${emise ? esc(r.cot.ref) : 'Brouillon — référence attribuée à l’émission'}</span></div>
            <span class="badge ${emise ? 'ok' : ''}">${emise ? 'Offre émise' : 'Brouillon'}</span></div>
          <div class="im"><span>${esc(l1)}</span><span>${l2}</span><span>${emise ? 'Émise le ' + esc(dateL(r.cot.creeLe.slice(0, 10))) : 'Modifiée le ' + esc(dateL(isoLocal(new Date(r.majLe))))}${r.envoyeLe ? ' · transmise le ' + esc(dateL(r.envoyeLe.slice(0, 10))) : ''}</span></div>
          ${conf ? `<div class="confirm" role="alert">${emise ? `Supprimer l’offre ${esc(r.cot.ref)} de cet appareil ? Une offre déjà transmise reste connue de la Direction technique.` : 'Supprimer ce brouillon ?'}<div class="ia"><button class="btn sm danger" data-act="delok" type="button">Confirmer la suppression</button><button class="btn sm" data-act="delno" type="button">Annuler</button></div></div>` : ''}
          <div class="ia"><button class="btn sm" data-act="open" type="button">Ouvrir</button><button class="btn sm" data-act="dup" type="button">Dupliquer</button>${emise ? '<button class="btn sm" data-act="pdf" type="button">PDF</button><button class="btn sm" data-act="json" type="button">JSON</button>' : ''}<button class="btn sm danger" data-act="del" type="button">Supprimer</button></div></article>`;
      }).join('') : `<p class="empty">${L.length ? 'Aucune cotation ne correspond à la recherche.' : 'Aucune cotation enregistrée sur cet appareil.'}</p>`}</div>`;
    $('#q').oninput = sur((ev) => { S.filtre = ev.target.value; const pos = ev.target.selectionStart; renderHist(); const q2 = $('#q'); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) { /* */ } });
    $$('[data-sel]').forEach((x) => { x.onchange = sur(() => { S.sel[x.dataset.sel] = x.checked; if (!Object.values(S.sel).some(Boolean)) S.sel.__aucun = true; renderHist(); }); });
    $$('.item [data-act]').forEach((b) => {
      b.onclick = sur(() => {
        const id = b.closest('.item').dataset.id, r = liste().find((x) => x.id === id); if (!r) return;
        const act = b.dataset.act;
        if (act === 'open') { S.cur = r; S.livre = null; S.tab = 'cot'; render(); window.scrollTo(0, 0); }
        else if (act === 'dup') dupliquer(r);
        else if (act === 'pdf') telechargerPdf(r, 'envMsg');
        else if (act === 'json') exporterUn(r, 'envMsg');
        else if (act === 'del') { S.confirmDel = id; renderHist(); }
        else if (act === 'delno') { S.confirmDel = null; renderHist(); }
        else if (act === 'delok') { S.confirmDel = null; ecrireListe(liste().filter((x) => x.id !== id)); delete S.sel[id]; if (S.cur && S.cur.id === id) S.cur = null; render(); toast('Cotation supprimée de cet appareil.'); }
      });
    });
    $('#bEnv').onclick = sur(() => envoyerDT());
  }
  function envoyerDT() {
    const L = liste(), sel = L.filter((r) => r.statut === 'offre émise' && S.sel[r.id]);
    if (!sel.length) return;
    const now = new Date(), st = `${isoLocal(now).replace(/-/g, '')}-${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
    const nom = `LR_lot_${S.user.code}_${st}.json`;
    const produits = ['Libre Retraite', 'SECURIS'].filter((p) => sel.some((r) => PROD[produitDe(r)] === p));
    const lot = { format: 'lr-cotation-1-lot', genereLe: now.toISOString(), commercial: { code: S.user.code, nom: S.user.nom }, produits, nombre: sel.length, cotations: sel.map((r) => r.cot) };
    const f = livrer(new Blob([JSON.stringify(lot, null, 2)], { type: 'application/json' }), nom, 'json');
    const t = now.toISOString(); L.forEach((r) => { if (sel.some((x) => x.id === r.id)) r.envoyeLe = t; }); ecrireListe(L);
    const dt = CFG.contactDT || {};
    let mail = '';
    if (dt.email) {
      const sujet = `Cotations ${produits.join(' et ')} — ${S.user.nom} (${S.user.code}) — ${sel.length} offre(s)`;
      const corps = `Bonjour,\n\nVeuillez trouver ci-joint le fichier ${nom} (${sel.length} offre(s) émise(s)) à intégrer aux affaires en cours :\n\n${sel.map((r) => `- ${r.cot.ref} (${PROD[produitDe(r)]}) : ${r.cot.client.prenom} ${String(r.cot.client.nom).toUpperCase()}, primes 1re année ${fmt(r.cot.resultat.primes1reAnnee, 2)} USD`).join('\n')}\n\nLe fichier a été téléchargé sur mon appareil : je le joins à ce message.\n\n${S.user.nom}\n${S.user.bureau || ''}`;
      mail = `mailto:${encodeURIComponent(dt.email).replace(/%40/g, '@')}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
    }
    S.sel = {}; renderHist();
    f.titre = `Fichier ${nom} préparé (${sel.length} offre(s)).`; S.livre = f;
    $('#envMsg').innerHTML = panneauFichier(f, 'envOk') + (mail ? `<div class="okbox mt8">Joignez le fichier au message préparé : <a class="btn sm" id="aMail" href="${esc(mail)}">Ouvrir l’e-mail à la Direction technique</a> <span class="fine">(adresse : ${esc(dt.email)})</span></div>` : '<p class="fine">Transmettez le fichier à la Direction technique.</p>');
    brancherPanneau();
    if (mail) { try { $('#aMail').click(); } catch (e) { /* le lien reste disponible */ } }
  }

  /* ---------- Barème et profil ---------- */
  function renderBareme() {
    const p = profil(), dt = CFG.contactDT || {};
    const rows = [['Taux garanti annuel', pct(PARAM.tauxGaranti, 0) + ' (net de frais de gestion sur l’épargne)'], ['Frais sur versement initial', pct(PARAM.fraisVersementInitial, 0) + ' (montant investi = versement ÷ ' + fmt(1 + PARAM.fraisVersementInitial, 2) + ')'], ['Frais sur primes périodiques', pct(PARAM.fraisPrimePeriodique, 0) + ' de chaque prime'], ['Durée', `${PARAM.dureeMin} à ${PARAM.dureeMax} ans (versement unique : ${PARAM.dureeMinPrimeUnique} à ${PARAM.dureeMax} ans)`], ['Prime minimale', `${fmt(PARAM.primeMinMensuelleEquiv)} USD par mois ou équivalent`], ['Versement unique minimal', `${fmt(PARAM.versementInitialMin)} USD`], ['Âge', `${PARAM.ageMinSouscription} ans minimum à la souscription, ${PARAM.ageMaxTerme} ans maximum au terme`], ['Fractionnements', PARAM.fractionnements.map((f) => FRAC_LIB[f]).join(', ')], ['Barème', PARAM.versionBareme + ' · moteur ' + M.VERSION]];
    const rowsSec = SEC.ok ? [['Garanties', 'Décès toutes causes et PTIA, capital constant'], ['Tarif', 'Tarif commercial RAWSUR, toutes taxes et frais accessoires inclus'], ['Capital', `${fmt(PSEC.capitalMin)} à ${fmt(PSEC.capitalMax)} USD`], ['Âge', `${PSEC.ageMin} à ${PSEC.ageMax} ans à la date d’effet (âge le plus proche), ${PSEC.ageMaxTerme} ans maximum au terme`], ['Durée', `${PSEC.dureeMin} à ${PSEC.dureeMax} ans`], ['Paiement', PSEC.fractionnements.map((f) => SEC_FRAC[f] || f).join(' ou ')], ['Formalités', 'Questionnaire médical'], ['Barème', PSEC.versionBareme + ' · moteur ' + SM.VERSION]] : null;
    $('#main').innerHTML = `<div class="grid"><div class="col"><section class="card"><h2>Libre Retraite 🔒</h2><p class="fine">Paramètres fixés par la Direction technique, non modifiables dans cet outil.</p>
      <dl class="bar" id="barLr">${rows.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></section>
      <section class="card"><h2>SECURIS 🔒</h2>${rowsSec ? `<dl class="bar" id="barSec">${rowsSec.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>` : `<p class="fine">${esc(SEC.msg)}</p>`}</section></div>
      <section class="card col"><h2>Ma carte de conseiller</h2><p class="fine">Ces coordonnées figurent sur les offres PDF et dans le JSON des cotations. Nom, code et bureau sont fixés par la Direction technique ; l’e-mail et le téléphone sont ceux saisis à la connexion.</p>
      <div class="fields"><label>Nom<input value="${esc(S.user.nom)}" disabled></label><label>Code commercial<input id="pCode" value="${esc(S.user.code)}" disabled></label><label class="wide">Bureau<input value="${esc(S.user.bureau)}" disabled></label>
      <label>Téléphone<input id="pTel" type="tel" value="${esc(p.telephone)}" disabled></label><label>E-mail<input id="pMail" type="email" value="${esc(p.email)}" disabled></label></div>
      ${dt.email || dt.nom || dt.telephone ? `<h2 class="mt">Direction technique</h2><p>${esc(dt.nom || '')}${dt.email ? '<br>' + esc(dt.email) : ''}${dt.telephone ? '<br>' + esc(dt.telephone) : ''}</p>` : ''}
      <h2 class="mt">Environnement</h2><p class="fine" id="envInfo">${esc(location.protocol === 'file:' ? 'Fichier ouvert depuis l’appareil' : location.protocol.replace(':', ''))} · empreintes : ${esc(SHA_MODE)} · identifiants : ${esc(AC ? AC.etat.mode : '—')} · stockage local : ${ST.ok ? 'disponible' : 'indisponible (mémoire de la page)'}${ENV.iframe ? ' · aperçu intégré' : ''} · bibliothèque PDF : ${window.jspdf && window.jspdf.jsPDF ? 'intégrée' : 'absente'}</p></section></div>`;
  }

  /* ---------- Démarrage ---------- */
  function polices() {
    try { if (!window.FontFace || typeof LR_FONTS === 'undefined') return; [['r', '400'], ['s', '600'], ['b', '700']].forEach(([k, w]) => { const f = new FontFace('Poppins', `url(data:font/ttf;base64,${LR_FONTS[k]})`, { weight: w }); f.load().then((x) => document.fonts.add(x)).catch(() => {}); }); } catch (e) { /* polices système */ }
  }
  async function verifierSecuris() {
    if (!SECC) return;
    try {
      const h = await sha256hex(canon({ bareme: SECC.bareme, conc: SECC.conc }));
      if (!/^[0-9a-f]{64}$/.test(String(SECC.empreinteBareme || ''))) SEC.msg = 'SECURIS indisponible : empreinte du barème absente de la configuration.';
      else if (h !== SECC.empreinteBareme) SEC.msg = 'SECURIS indisponible : le barème de cette page ne correspond pas à son empreinte (page modifiée). Contactez la Direction technique.';
      else { SEC.ok = true; SEC.msg = ''; }
    } catch (e) { SEC.msg = 'SECURIS indisponible : vérification du barème impossible (' + e.message + ').'; }
  }
  polices();
  verifierSecuris().then(sur(() => {
    render();
    reprendreSession().catch((e) => erreurVisible(e && e.message ? e.message : String(e)));
  }));
  /* session de l'onglet : e-mail et téléphone saisis, vérifiés de nouveau contre les empreintes au rechargement */
  async function reprendreSession() {
    if (!CFG || !Array.isArray(CFG.comptes) || !AC || S.user) return;
    let s = null; try { s = JSON.parse(ST.sget('lr-session-2') || 'null'); } catch (e) { s = null; }
    if (!s || !s.email || !s.tel) return;
    const u = await AC.verifier(CFG.comptes, s.email, s.tel);
    if (u && !S.user) connecter(u, s.email, s.tel); else if (!u) ST.sset('lr-session-2', null);
  }
  window.LRApp = { canon, empreinte, sha256hex, sha256js, b64utf8, env: ENV, securis: SEC, shaMode: () => SHA_MODE, acces: AC, utilisateur: () => (S.user ? Object.assign({}, S.user) : null), limitation: () => Object.assign({ attente: attenteRestante() }, LIM), version: '2.1' };
})();
</script>
</body>
